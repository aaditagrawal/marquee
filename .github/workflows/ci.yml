# Continuous integration: lint, offline unit/screenshot tests, debug + unsigned release APKs,
# and the benchmark tooling's Python unit tests. Needs no secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep Gradle within a standard runner's memory and make logs readable.
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2
  JAVA_VERSION: "21"

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Open-source (MIT) cache provider built on actions/cache.
          cache-provider: basic
          add-job-summary: on-failure

      - name: Motion gate (no animation APIs in app sources)
        run: tools/check-motion.sh

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Unit and screenshot tests (offline Robolectric; every Roborazzi golden must match)
        run: ./gradlew :app:verifyRoborazziDebug --console=plain

      - name: Assemble debug and unsigned release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apks-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error

  bench-tools:
    name: Benchmark tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Run pytest
        run: uv run --no-project --with pytest pytest bench/
