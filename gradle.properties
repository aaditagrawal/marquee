# Memory-friendly defaults for laptops and CI runners. Override locally in ~/.gradle/gradle.properties.
# Gradle itself must run on JDK 17 or newer (JDK 21 is what this project is tested with);
# sources compile to Java/Kotlin bytecode level 17. See docs/dev/BUILD_NOTES.md.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.daemon.idletimeout=900000
kotlin.daemon.jvmargs=-Xmx1g
kotlin.compiler.execution.strategy=in-process
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
